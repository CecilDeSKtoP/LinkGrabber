<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Grabber</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="../icons/icon48.png" alt="Link Grabber" class="brand-icon">
        <div class="brand-text">
          <span class="brand-title">Link Grabber</span>
          <span class="brand-desc">Drag & Copy Links</span>
        </div>
      </div>
      <label class="switch" title="확장 프로그램 켜기/끄기">
        <input type="checkbox" id="toggleEnabled" checked>
        <span class="slider"></span>
      </label>
    </header>

    <div class="divider"></div>

    <!-- Settings Section -->
    <div class="section">
      <div class="section-title">기본 설정</div>
      
      <!-- Modifier Key Selector -->
      <div class="setting-item">
        <div class="setting-label">
          <span class="label-title">단축키 조합</span>
          <span class="label-desc">마우스 드래그와 함께 누를 키</span>
        </div>
        <select id="modifierSelect" class="select-box">
          <option value="ctrlOrCmd">Ctrl / Cmd (권장)</option>
          <option value="ctrl">Ctrl 전용</option>
          <option value="alt">Alt 키</option>
          <option value="shift">Shift 키</option>
        </select>
      </div>

      <!-- Deduplicate Option -->
      <div class="setting-item">
        <div class="setting-label">
          <span class="label-title">중복 URL 제거</span>
          <span class="label-desc">동일한 링크는 1개만 복사</span>
        </div>
        <label class="checkbox-container">
          <input type="checkbox" id="checkDeduplicate" checked>
          <span class="checkmark"></span>
        </label>
      </div>
    </div>

    <!-- Usage Guide -->
    <div class="section guide-section">
      <div class="section-title">사용 방법</div>
      <div class="guide-box">
        <div class="guide-step">
          <kbd id="guideKeyBadge">Ctrl</kbd> + <span class="guide-action">마우스 좌클릭 드래그</span>
          <p class="guide-desc">원하는 링크들이 포함되도록 사각형 영역을 지정하세요.</p>
        </div>
        <div class="guide-step">
          <kbd>Esc</kbd>
          <p class="guide-desc">드래그 도중 취소할 수 있습니다.</p>
        </div>
      </div>
    </div>

    <!-- Stats & Footer -->
    <footer class="footer">
      <div class="stats">
        <span>누적 복사 링크:</span>
        <strong id="statCount">0</strong>개
      </div>
      <button id="resetStatBtn" class="link-btn" title="통계 초기화">초기화</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
